<!DOCTYPE html>
<html lang="fr" data-theme="{{ user_theme }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifier — {{ pt.name }}</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0f0f0d;--surface:#1a1a17;--surface2:#222220;--border:rgba(255,255,255,0.08);--text:#f0ede6;--muted:#8a887f;--green:#4ade9a;--red:#f87171;--blue:#5b9dff;}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:0.5px solid var(--border);}
.brand{font-family:'DM Serif Display',serif;font-size:22px;}
.userbar a{color:var(--muted);text-decoration:none;font-size:13px;}
.wrap{max-width:720px;margin:0 auto;padding:26px 24px 60px;}
.back{color:var(--muted);text-decoration:none;font-size:13px;display:inline-block;margin-bottom:16px;}
h1{font-family:'DM Serif Display',serif;font-size:26px;font-weight:400;margin-bottom:20px;}
label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
input[type=text],select{width:100%;background:var(--surface2);border:0.5px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14px;}
.field{margin-bottom:18px;}
.variant{background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;position:relative;}
.variant .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.variant .grid{grid-template-columns:1fr;}}
.variant .full{grid-column:1/-1;}
.rm{position:absolute;top:10px;right:10px;background:rgba(248,113,113,0.12);color:var(--red);border:none;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px;}
.thumb{margin-top:8px;max-height:90px;border-radius:8px;display:none;}
.filebtn{display:inline-block;background:var(--surface2);border:0.5px solid var(--border);color:var(--text);border-radius:10px;padding:10px 13px;font-size:13px;cursor:pointer;}
input[type=file]{display:none;}
.btn-add{background:var(--surface2);border:0.5px dashed var(--border);color:var(--muted);border-radius:12px;padding:12px;width:100%;cursor:pointer;font-family:inherit;font-size:14px;}
.btn-add:hover{color:var(--text);border-color:rgba(255,255,255,0.2);}
.vhead{font-size:12px;color:var(--muted);margin:22px 0 12px;font-weight:600;}
.actions{display:flex;gap:12px;margin-top:24px;}
.btn-save{background:var(--green);color:#04120b;border:none;border-radius:12px;padding:13px 26px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer;}
.btn-cancel{background:transparent;color:var(--muted);border:0.5px solid var(--border);border-radius:12px;padding:13px 22px;text-decoration:none;font-size:15px;}
</style>
{% include "inventory/_tp_chrome.html" %}
</head>
<body>
<div class="topbar">
  <div class="brand"><span style="background:linear-gradient(100deg,var(--text,#f0ede6) 35%,var(--green,#4ade9a) 120%);-webkit-background-clip:text;background-clip:text;color:transparent;">Barats</span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green,#4ade9a);margin-left:5px;box-shadow:0 0 8px var(--green,#4ade9a);"></span></div>
  <div class="userbar">
    <a class="navbtn" href="{% url 'dashboard' %}">🏠 Dashboard</a>
    <button class="navbtn" onclick="toggleTheme()"><span id="theme-icon">{% if user_theme == 'light' %}🌙{% else %}☀{% endif %}</span></button>
    <a href="{% url 'testing_production_page' %}?tab={{ pt.status }}">← Retour</a>
  </div>
</div>

<div class="wrap">
  <a class="back" href="{% url 'testing_production_page' %}?tab={{ pt.status }}">← Retour</a>
  <h1>✏️ Modifier le produit</h1>

  <form method="post" enctype="multipart/form-data" id="form">
    {% csrf_token %}
    <div class="field">
      <label>Nom du produit</label>
      <input type="text" name="name" value="{{ pt.name }}" required>
    </div>

    <div class="field">
      <label>Lien Facebook</label>
      <input type="text" name="facebook_link" value="{{ pt.facebook_link }}" placeholder="https://facebook.com/...">
    </div>

    <div class="field">
      <label>Page</label>
      <select name="sales_page">
        <option value="">— Aucune —</option>
        {% for p in pages %}
        <option value="{{ p.id }}" {% if pt.sales_page_id == p.id %}selected{% endif %}>{{ p.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="vhead">COULEURS / TAILLES</div>
    <div id="variants">
      {% for v in pt.variants.all %}
      <div class="variant">
        <button type="button" class="rm" title="Retirer cette couleur" onclick="this.parentNode.remove()">✕</button>
        <input type="hidden" name="vid_{{ forloop.counter0 }}" value="{{ v.id }}">
        <div class="grid">
          <div><label>Couleur</label><input type="text" name="color_{{ forloop.counter0 }}" value="{{ v.color_label }}" placeholder="ex: Beige"></div>
          <div><label>Tailles</label><input type="text" name="sizes_{{ forloop.counter0 }}" value="{{ v.sizes }}" placeholder="ex: S,M,L,XL"></div>
          <div class="full">
            <label>Photo de la couleur</label>
            <label class="filebtn" for="img_{{ forloop.counter0 }}">📷 {% if v.image %}Changer la photo{% else %}Choisir une photo{% endif %}</label>
            <input type="file" id="img_{{ forloop.counter0 }}" name="image_{{ forloop.counter0 }}" accept="image/*" onchange="prev(this)">
            <img class="thumb" id="thumb_{{ forloop.counter0 }}" {% if v.image %}src="{{ v.image.url }}" style="display:block"{% endif %}>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>

    <button type="button" class="btn-add" onclick="addVariant()">+ Ajouter une couleur</button>

    <input type="hidden" name="variant_count" id="variant_count" value="{{ pt.variants.count }}">
    <div class="actions">
      <button type="submit" class="btn-save">Enregistrer</button>
      <a class="btn-cancel" href="{% url 'testing_production_page' %}?tab={{ pt.status }}">Annuler</a>
    </div>
  </form>
</div>

<script>
let idx = {{ pt.variants.count }};
function addVariant(){
  const i = idx++;
  const wrap = document.getElementById('variants');
  const div = document.createElement('div');
  div.className = 'variant';
  div.innerHTML =
    '<button type="button" class="rm" title="Retirer" onclick="this.parentNode.remove()">✕</button>' +
    '<input type="hidden" name="vid_'+i+'" value="">' +
    '<div class="grid">' +
      '<div><label>Couleur</label><input type="text" name="color_'+i+'" placeholder="ex: Beige"></div>' +
      '<div><label>Tailles</label><input type="text" name="sizes_'+i+'" placeholder="ex: S,M,L,XL"></div>' +
      '<div class="full">' +
        '<label>Photo de la couleur</label>' +
        '<label class="filebtn" for="img_'+i+'">📷 Choisir une photo</label>' +
        '<input type="file" id="img_'+i+'" name="image_'+i+'" accept="image/*" onchange="prev(this)">' +
        '<img class="thumb" id="thumb_'+i+'">' +
      '</div>' +
    '</div>';
  wrap.appendChild(div);
  document.getElementById('variant_count').value = idx;
}
function prev(input){
  const f = input.files && input.files[0]; if(!f) return;
  const img = document.getElementById('thumb_' + input.id.split('_')[1]);
  img.src = URL.createObjectURL(f); img.style.display = 'block';
}
</script>
</body>
</html>
