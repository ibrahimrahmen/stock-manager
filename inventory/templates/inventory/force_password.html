<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0f0f0d;--surface:#1a1a17;--surface2:#222220;--border:rgba(255,255,255,0.08);--text:#f0ede6;--muted:#8a887f;--green:#4ade9a;--red:#f87171;--blue:#5b9dff;}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:420px;}
.icon{width:56px;height:56px;border-radius:16px;background:rgba(91,157,255,0.15);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:18px;}
h1{font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;margin-bottom:6px;}
.sub{color:var(--muted);font-size:14px;margin-bottom:22px;}
label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
input[type=password]{width:100%;background:var(--surface2);border:0.5px solid var(--border);color:var(--text);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:15px;margin-bottom:16px;}
button{width:100%;background:var(--green);color:#04120b;border:none;border-radius:12px;padding:13px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer;}
.err{background:rgba(248,113,113,0.12);color:var(--red);border:0.5px solid var(--red);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px;}
.logout{display:block;text-align:center;margin-top:16px;color:var(--muted);text-decoration:none;font-size:13px;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔒</div>
  <h1>Créez votre mot de passe</h1>
  <div class="sub">Bonjour {{ request.user.username }} — pour votre sécurité, veuillez définir un nouveau mot de passe avant de continuer.</div>

  {% if error %}<div class="err">{{ error }}</div>{% endif %}

  <form method="post">
    {% csrf_token %}
    <label>Nouveau mot de passe</label>
    <input type="password" name="password1" placeholder="Au moins 6 caractères" required autofocus>
    <label>Confirmer le mot de passe</label>
    <input type="password" name="password2" placeholder="Retapez le mot de passe" required>
    <button type="submit">Enregistrer et continuer</button>
  </form>
  <a class="logout" href="{% url 'logout' %}">Se déconnecter</a>
</div>
</body>
</html>
