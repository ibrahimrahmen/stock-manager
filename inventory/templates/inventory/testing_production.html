<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testing &amp; Production</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0f0d; --surface:#1a1a17; --surface2:#222220;
  --border:rgba(255,255,255,0.08); --text:#f0ede6; --muted:#8a887f;
  --blue:#5b9dff; --blue-dim:rgba(91,157,255,0.15);
}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:0.5px solid var(--border);}
.brand{font-family:'DM Serif Display',serif;font-size:22px;}
.userbar a{color:var(--muted);text-decoration:none;font-size:13px;}
.userbar a:hover{color:var(--text);}
.wrap{max-width:1000px;margin:0 auto;padding:32px 24px;}
.page-title{font-family:'DM Serif Display',serif;font-size:30px;margin-bottom:6px;display:flex;align-items:center;gap:12px;}
.page-icon{width:52px;height:52px;border-radius:16px;background:var(--blue-dim);display:flex;align-items:center;justify-content:center;font-size:26px;}
.sub{color:var(--muted);font-size:14px;margin-bottom:28px;}
.placeholder{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:40px;text-align:center;color:var(--muted);}
.placeholder h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:20px;color:var(--text);margin-bottom:8px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Stock Manager</div>
  <div class="userbar"><a href="{% url 'home' %}">← Accueil</a></div>
</div>

<div class="wrap">
  <div class="page-title"><span class="page-icon">🧪</span> Testing &amp; Production</div>
  <div class="sub">Test des produits et passage en production.</div>

  <div class="placeholder">
    <h2>Interface en cours de construction</h2>
    <div>On la construit étape par étape.</div>
  </div>
</div>
</body>
</html>
