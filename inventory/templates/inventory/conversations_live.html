{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversations en direct — Barats</title>
<style>
  :root{
    --bg:#f5f4f0; --card:#fff; --ink:#1c1c1a; --muted:#6b6a64; --border:#e4e2db;
    --green:#0f6e56; --greenbg:#dff3ec; --amber:#ba7517; --amberbg:#faeeda;
    --gray:#888780; --graybg:#eceae3; --red:#c0392b; --redbg:#fbecea;
    --blue:#185fa5; --bluebg:#e6f1fb; --purple:#534ab7; --purplebg:#eeedfe;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.4;padding:14px;}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;max-width:1300px;margin-left:auto;margin-right:auto;}
  h1{font-size:19px;margin:0;font-weight:600;}
  .count{background:var(--graybg);border-radius:999px;padding:3px 11px;font-weight:600;font-size:13px;}
  .bar{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);}
  .toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
  #wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;
    max-width:1300px;margin:0 auto;}
  .cv{background:var(--card);border:0.5px solid var(--border);border-radius:14px;
    display:flex;flex-direction:column;height:380px;overflow:hidden;}
  .cv.wait{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset;}
  .cvh{padding:9px 12px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .cvh .nm{font-weight:600;font-size:14px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:0 0 8px;}
  .badge{font-size:10px;padding:1px 7px;border-radius:999px;font-weight:600;}
  .b-ms{background:var(--bluebg);color:var(--blue);} .b-ig{background:var(--purplebg);color:var(--purple);}
  .ib{font-size:10px;padding:1px 7px;border-radius:999px;font-weight:600;}
  .i-price{background:var(--greenbg);color:var(--green);}
  .i-availability{background:var(--bluebg);color:var(--blue);}
  .i-product{background:var(--purplebg);color:var(--purple);}
  .i-exchange{background:var(--amberbg);color:var(--amber);}
  .i-delivery{background:#e6eff5;color:#2b6a86;}
  .i-order{background:var(--graybg);color:var(--ink);}
  .i-faq{background:#eaf3de;color:#3b6d11;}
  .i-greeting,.i-other{background:var(--graybg);color:var(--muted);}
  .mins{margin-left:auto;font-size:11px;color:var(--muted);}
  .ad{font-size:11px;color:var(--muted);padding:0 12px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cvm{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:5px;background:var(--bg);}
  .b{max-width:82%;padding:6px 9px;border-radius:12px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;}
  .b .lbl{font-size:9px;opacity:.7;display:block;font-weight:600;}
  .b.u{align-self:flex-start;background:#fff;border:0.5px solid var(--border);border-bottom-left-radius:3px;}
  .b.p{align-self:flex-end;background:#0f6e56;color:#fff;border-bottom-right-radius:3px;}
  .b.s{align-self:center;background:transparent;color:var(--muted);font-size:11px;text-align:center;}
  .b img{display:block;max-width:120px;border-radius:8px;margin-top:4px;}
  .cvf{padding:7px 10px;border-top:0.5px solid var(--border);font-size:11.5px;}
  .cvf .sg{border-radius:8px;padding:5px 8px;white-space:pre-wrap;}
  .s-ok{background:var(--greenbg);color:var(--green);} .s-ask{background:var(--graybg);color:var(--ink);}
  .s-need{background:var(--amberbg);color:var(--amber);} .s-no{background:transparent;color:var(--muted);font-style:italic;}
  .s-rt{background:#eef1f6;color:#44557a;}
  .s-done{background:transparent;color:var(--muted);}
  .anbtn{margin-top:6px;width:100%;border:0.5px solid var(--border);background:var(--bluebg);
    color:var(--blue);border-radius:8px;padding:6px 8px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .anbtn:disabled{opacity:.6;cursor:default;}
  .anbox{margin-top:6px;border:0.5px solid var(--border);border-radius:8px;padding:7px 8px;background:#fff;}
  .anstep{font-size:11px;color:var(--muted);margin:2px 0;}
  .anstep b{color:var(--ink);}
  .anreply{border-radius:8px;padding:5px 8px;margin-top:5px;font-size:12px;white-space:pre-wrap;}
  .anreply.ok{background:var(--greenbg);color:var(--green);}
  .anreply.ask{background:var(--graybg);color:var(--ink);}
  .anmeta{font-size:10px;color:var(--muted);margin-top:4px;}
  .anmeta b{color:var(--ink);}
  .aibtn{margin-top:6px;width:100%;border:0.5px solid var(--purple);background:var(--purplebg);
    color:var(--purple);border-radius:8px;padding:6px 8px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .aibtn:disabled{opacity:.6;cursor:default;}
  .aibox{margin-top:6px;border:0.5px solid var(--border);border-radius:8px;padding:7px 8px;background:#fff;}
  .aibadge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;}
  .ai-send{background:var(--greenbg);color:var(--green);} .ai-human{background:var(--amberbg);color:var(--amber);}
  .aisum{font-size:11px;color:var(--muted);margin:4px 0 5px;}
  .airep{border-radius:8px;padding:5px 8px;font-size:12.5px;white-space:pre-wrap;background:var(--bg);border:0.5px solid var(--border);}
  .cvh{cursor:pointer;}
  .tmodal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;}
  .tmbox{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;border:0.5px solid var(--border);}
  .tmh{padding:12px 14px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px;}
  .tmh .nm{font-weight:600;font-size:15px;}
  .tmh .x{margin-left:auto;border:0;background:var(--graybg);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;}
  .tmbody{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg);}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0;}
</style>
</head>
<body>
  <div class="top">
    <h1>💬 Conversations</h1>
    <span class="count" id="count">…</span>
    <div class="bar">
      <label class="toggle"><input type="checkbox" id="showall"> Tout afficher</label>
      <label class="toggle"><input type="checkbox" id="auto" checked> live</label>
      <span id="updated"></span>
    </div>
  </div>
  <div id="wall"><div class="empty">Chargement…</div></div>
  <div id="threadModal" class="tmodal" hidden>
    <div class="tmbox">
      <div class="tmh"><span class="nm" id="tmName">…</span><button class="x" onclick="closeThread()">×</button></div>
      <div class="tmbody" id="tmBody"></div>
    </div>
  </div>

<script>
const wall=document.getElementById('wall');
function esc(s){return (s||'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));}
function ago(m){ if(m<1)return "à l'instant"; if(m<60)return "il y a "+m+" min"; return "il y a "+Math.floor(m/60)+" h"; }
function suggClass(by){ if(['ad','fingerprint','vision','ad_text'].includes(by))return 's-ok';
  if(by==='need_analysis')return 's-need'; if(by==='not_price')return 's-no'; return 's-ask'; }
function flagLabel(f){ return ({auto:'auto 🤖',faq:'FAQ 🤖',bot:'bot 🤖',carousel:'carrousel 🤖',human:'équipe 🧑'}[f])||''; }

function bubbles(msgs){
  return (msgs||[]).map(m=>{
    if(m.from==='system') return '<div class="b s">'+esc(m.text)+'</div>';
    const cls=m.from==='user'?'u':'p';
    const lbl=(m.from!=='user'&&flagLabel(m.flag))?('<span class="lbl">'+flagLabel(m.flag)+'</span>'):'';
    const imgs=(m.images||[]).map(u=>'<img src="'+esc(u)+'" onerror="this.style.display=\'none\'">').join('');
    return '<div class="b '+cls+'">'+lbl+esc(m.text)+imgs+'</div>';
  }).join('');
}
const analyzed={};  // id -> full trace, so a click survives the 10s refresh
function methodLabel(by){ return ({ad:'🔗 lien de la pub',ad_text:'📣 prix écrit dans la pub',
  fingerprint:'🧬 photo identique au catalogue',vision:'🤖 reconnu par IA (Vision)',
  ask_photo:'🙈 pas sûr → demande une photo',need_analysis:'photo à analyser',
  not_price:'pas une question de prix'}[by])||by||'—'; }
function analysisHtml(tr){
  let h='<div class="anbox">';
  (tr.steps||[]).forEach(s=>{
    if(s.tier===0) return;
    const ic = s.found?'✅':(s.tried===false?'⚪':'❌');
    const d = s.found?('<b>'+esc(s.offer||'')+'</b>'):esc(s.why||'');
    h+='<div class="anstep">'+ic+' '+esc(s.name)+' — '+d+'</div>';
  });
  const ok = ['ad','ad_text','fingerprint','vision'].includes(tr.resolved_by);
  h+='<div class="anreply '+(ok?'ok':'ask')+'">'+(ok?'✅ ':'📷 ')+esc(tr.reply)+'</div>';
  h+='<div class="anmeta">Méthode : <b>'+esc(methodLabel(tr.resolved_by))
     +'</b> · coût : '+esc(tr.cost_est||'0')+' · rien envoyé</div></div>';
  return h;
}
wall.addEventListener('click', async (e)=>{
  const btn=e.target.closest('.anbtn'); if(!btn) return;
  const id=btn.dataset.id;
  btn.disabled=true; btn.textContent='⏳ analyse en cours…';
  try{
    const r=await fetch('/api/price-agent-on-conv/'+id+'/',{credentials:'include'});
    const j=await r.json();
    if(j.status==='ok'){ analyzed[id]=j.trace; btn.outerHTML=analysisHtml(j.trace); }
    else { btn.textContent='❌ '+(j.message||'erreur'); btn.disabled=false; }
  }catch(err){ btn.textContent='❌ erreur réseau'; btn.disabled=false; }
});
// SMART FALLBACK brain (on-demand, sends nothing)
const aiAnswers={};
function aiHtml(res){
  if(res.error) return '<div class="aibox"><div class="aisum">❌ '+esc(res.error)+'</div></div>';
  const human=!!res.needs_human;
  let h='<div class="aibox">';
  h+='<span class="aibadge '+(human?'ai-human':'ai-send')+'">'
    +(human?'🧑 pour l\'équipe':'✅ répondre')+'</span>';
  if(res.summary) h+='<div class="aisum">'+esc(res.summary)+'</div>';
  if(res.reply) h+='<div class="airep">'+esc(res.reply)+'</div>';
  if(res.model) h+='<div class="aisum" style="margin-top:4px;opacity:.75;">🧩 '+esc(res.model)+'</div>';
  h+='</div>';
  return h;
}
wall.addEventListener('click', async (e)=>{
  const btn=e.target.closest('.aibtn'); if(!btn) return;
  const id=btn.dataset.aid;
  btn.disabled=true; btn.textContent='⏳ l\'IA réfléchit…';
  try{
    const r=await fetch('/api/ai-fallback-on-conv/'+id+'/',{credentials:'include'});
    const j=await r.json();
    if(j.status==='ok'){ aiAnswers[id]=j.ai; btn.outerHTML=aiHtml(j.ai); }
    else { btn.textContent='❌ '+(j.message||'erreur'); btn.disabled=false; }
  }catch(err){ btn.textContent='❌ erreur réseau'; btn.disabled=false; }
});
const ACTION={price:'🏷️ agent prix',availability:'📦 agent dispo',
  exchange:'🔁 agent échange (bientôt)',delivery:'🚚 réponse délai',
  order:'📝 capture commande',product:'🖼️ carrousel produits (bientôt)',
  faq:'🤖 agent FAQ',greeting:'👋 accueil',other:'💬 un humain'};
function footer(r){
  // The agent only suggests when the CUSTOMER is waiting on us. If we already
  // replied (we spoke last), the ball is in the customer's court — don't keep
  // proposing a price/answer.
  if(!r.waiting) return '<div class="sg s-done">✅ répondu — en attente du client</div>';
  if(r.intent==='faq' && r.faq_reply) return '<div class="sg s-ok">🤖 '+esc(r.faq_reply)+'</div>';
  if(r.intent==='delivery' && r.delivery_reply) return '<div class="sg s-ok">🤖 '+esc(r.delivery_reply)+'</div>';
  if(r.intent==='order'){
    if(r.order_done) return '<div class="sg s-done">✅ commande complète (numéro + adresse + taille) — rien à envoyer</div>';
    if(r.order_reply) return '<div class="sg s-ok">🤖 '+esc(r.order_reply)+'</div>';
  }
  if((r.intent==='price'||r.intent==='availability') && r.is_price_q){
    let h='<div class="sg '+suggClass(r.suggest_by)+'">🤖 '+esc(r.suggest)+'</div>';
    if(analyzed[r.id]) h+=analysisHtml(analyzed[r.id]);
    else h+='<button class="anbtn" data-id="'+r.id+'">🔍 Analyser (photo + IA) — rien n\'est envoyé</button>';
    return h;
  }
  // Keyword decider couldn't give a canned answer (exchange / product / unclear)
  // -> offer the SMART FALLBACK brain on demand (sends nothing).
  let h='<div class="sg s-rt">🧭 décide → '+esc(ACTION[r.intent]||ACTION.other)+'</div>';
  if(['other','exchange','product'].includes(r.intent)){
    if(aiAnswers[r.id]) h+=aiHtml(aiAnswers[r.id]);
    else h+='<button class="aibtn" data-aid="'+r.id+'">🧠 Réponse IA — rien n\'est envoyé</button>';
  }
  return h;
}
function card(r){
  const pb=r.platform==='instagram'?'<span class="badge b-ig">IG</span>':'<span class="badge b-ms">Msg</span>';
  const ib=r.intent_label?('<span class="ib i-'+esc(r.intent)+'">'+esc(r.intent_label)+'</span>'):'';
  const d=r.waiting?'<span class="dot"></span>':'';
  return '<div class="cv'+(r.waiting?' wait':'')+'" data-id="'+r.id+'">'
    +'<div class="cvh">'+d+'<span class="nm">'+esc(r.name)+'</span>'+pb+ib+'<span class="mins">'+ago(r.mins_ago)+'</span></div>'
    +(r.ad?('<div class="ad">📣 '+esc(r.ad)+'</div>'):'')
    +'<div class="cvm" data-id="'+r.id+'">'+bubbles(r.msgs)+'</div>'
    +'<div class="cvf">'+footer(r)+'</div></div>';
}

async function load(){
  try{
    const _all=document.getElementById('showall').checked?'?all=1':'';
    const r=await fetch('/api/conversations-live/'+_all,{credentials:'include'});
    const j=await r.json(); if(j.status!=='ok') return;
    document.getElementById('count').textContent=j.count+(document.getElementById('showall').checked?' au total':' en attente');
    document.getElementById('updated').textContent='maj '+new Date().toLocaleTimeString('fr-FR');
    // remember scroll positions of open threads
    const pos={};
    document.querySelectorAll('.cvm').forEach(el=>{
      pos[el.dataset.id]={top:el.scrollTop, bottom:(el.scrollHeight-el.scrollTop-el.clientHeight<40)};
    });
    wall.innerHTML = j.rows.length ? j.rows.map(card).join('') : '<div class="empty">Aucune conversation en cours 👋</div>';
    // restore / stick to bottom so new messages appear in place
    document.querySelectorAll('.cvm').forEach(el=>{
      const p=pos[el.dataset.id];
      if(!p || p.bottom){ el.scrollTop=el.scrollHeight; } else { el.scrollTop=p.top; }
    });
  }catch(e){}
}

// Click a card header -> open the FULL conversation history.
async function openThread(id, name){
  const modal=document.getElementById('threadModal'), body=document.getElementById('tmBody');
  document.getElementById('tmName').textContent=name||'Conversation';
  body.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px;">⏳ chargement…</div>';
  modal.hidden=false;
  try{
    const r=await fetch('/api/conversation-thread/'+id+'/',{credentials:'include'});
    const j=await r.json();
    if(j.status==='ok'){
      let h='';
      if(j.ad) h+='<div style="font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px;">📣 '+esc(j.ad)+'</div>';
      h+=bubbles(j.messages||[]);
      body.innerHTML=h||'<div style="color:var(--muted);text-align:center;">(vide)</div>';
      body.scrollTop=body.scrollHeight;
    } else body.innerHTML='<div style="color:var(--red);text-align:center;">'+esc(j.message||'erreur')+'</div>';
  }catch(e){ body.innerHTML='<div style="color:var(--red);text-align:center;">erreur réseau</div>'; }
}
function closeThread(){ document.getElementById('threadModal').hidden=true; }
document.getElementById('threadModal').addEventListener('click', e=>{ if(e.target.id==='threadModal') closeThread(); });
wall.addEventListener('click', e=>{
  const hd=e.target.closest('.cvh'); if(!hd) return;
  const card=hd.closest('.cv'); if(!card) return;
  const nm=(card.querySelector('.nm')||{}).textContent||'';
  openThread(card.dataset.id, nm);
});

let timer=null;
function schedule(){ if(timer)clearInterval(timer); if(document.getElementById('auto').checked){ timer=setInterval(load,10000);} }
document.getElementById('auto').onchange=schedule;
document.getElementById('showall').onchange=load;
load(); schedule();
</script>
</body>
</html>
